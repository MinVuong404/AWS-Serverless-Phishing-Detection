<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Security Scanner</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Google Sans', Roboto, 'Segoe UI', Arial, sans-serif;
    }
    body {
      width: 320px;
      padding: 16px;
      background-color: #ffffff;
      color: #202124;
    }
    .header {
      padding-bottom: 10px;
      border-bottom: 1px solid #dadce0;
      margin-bottom: 12px;
    }
    .title h1 {
      font-size: 14px;
      font-weight: 600;
      color: #202124;
    }
    .title p {
      font-size: 11px;
      color: #5f6368;
      margin-top: 2px;
    }
    .status-card {
      background: #f8f9fa;
      border: 1px solid #dadce0;
      border-radius: 4px;
      padding: 8px 10px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
    }
    .status-indicator {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 500;
      color: #137333;
    }
    .status-dot {
      width: 6px;
      height: 6px;
      background-color: #1e8e3e;
      border-radius: 50%;
    }
    .section-title {
      font-size: 11px;
      font-weight: 600;
      color: #5f6368;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }
    .quick-test-box textarea {
      width: 100%;
      height: 75px;
      padding: 8px;
      font-size: 12px;
      border: 1px solid #dadce0;
      border-radius: 4px;
      resize: none;
      outline: none;
      background: #ffffff;
      color: #202124;
      line-height: 1.4;
    }
    .quick-test-box textarea:focus {
      border-color: #1a73e8;
    }
    .btn-test {
      width: 100%;
      padding: 7px;
      margin-top: 8px;
      background: #1a73e8;
      color: #ffffff;
      border: none;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s ease;
    }
    .btn-test:hover {
      background: #1557b0;
    }
    .btn-test:active {
      background: #174ea6;
    }
    .test-result {
      margin-top: 10px;
      padding: 10px;
      border-radius: 4px;
      font-size: 12px;
      line-height: 1.5;
      display: none;
    }
    .result-phishing {
      background: #fce8e6;
      border: 1px solid #fad2cf;
      border-left: 3px solid #d93025;
      color: #202124;
    }
    .result-warning {
      background: #fef7e0;
      border: 1px solid #feefc3;
      border-left: 3px solid #f9ab00;
      color: #202124;
    }
    .result-safe {
      background: #e6f4ea;
      border: 1px solid #ceead6;
      border-left: 3px solid #1e8e3e;
      color: #202124;
    }
    .footer {
      margin-top: 12px;
      text-align: center;
      font-size: 10px;
      color: #80868b;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">
      <h1>Phishing Security Scanner</h1>
      <p>Hệ thống phân tích an toàn thông tin</p>
    </div>
  </div>

  <div class="status-card">
    <span>Dịch vụ máy chủ:</span>
    <div class="status-indicator">
      <span class="status-dot"></span>
      <span>Sẵn sàng kết nối</span>
    </div>
  </div>

  <div class="section-title">Kiểm tra nhanh văn bản</div>
  <div class="quick-test-box">
    <textarea id="testInput" placeholder="Dán nội dung tin nhắn hoặc văn bản cần kiểm tra vào đây..."></textarea>
    <button id="btnQuickTest" class="btn-test">Kiểm tra văn bản</button>
  </div>

  <div id="testResult" class="test-result"></div>

  <div class="footer">
    Real-time Serverless Phishing Detection
  </div>

  <script src="popup.js"></script>
</body>
</html>
